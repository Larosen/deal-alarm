services:
  deal-alarm:
    build: .
    container_name: deal-alarm
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      TZ: Europe/Berlin
      # Hinter einem Reverse-Proxy (z. B. Pangolin): Proxy-IPs/Netze, deren X-Forwarded-For gilt
      # TRUSTED_PROXIES: private
      # Optionaler Passwortschutz der Weboberfläche (Benutzer: admin)
      # UI_PASSWORD: geheim
      # Diagnosemodus: Shop-Antworten unter ./data/debug speichern (zur Fehlersuche)
      # DEBUG_CAPTURE: "1"
